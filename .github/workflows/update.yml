name: Update and Deploy Rates

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # 매 정각마다 실행
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 markdown

      - name: Update Rates
        run: |
          python update_rates.py

      - name: Build HTML
        run: |
          python build_html.py

      - name: Commit and Push Markdown Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 경쟁률_현황.md index.html
          git commit -m "Auto-update competition rates [skip ci]" || echo "No changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
